<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Perishable Monitoring System - Login">
    <title>Login | Smart Perishable Monitoring</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🥬</div>
                <h2>Smart Perishable</h2>
                <p>Monitoring System for Supermarkets</p>
            </div>

            <div class="login-error" id="loginError">
                Invalid username or password. Please try again.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                    🔐 Sign In
                </button>
            </form>

            <div class="demo-accounts">
                <p>Demo Accounts</p>
                <button class="demo-btn" onclick="fillDemo('admin', 'admin123')">👨‍💼 Admin</button>
                <button class="demo-btn" onclick="fillDemo('staff1', 'staff123')">👤 Staff</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            
            btn.innerHTML = '⏳ Signing in...';
            btn.disabled = true;
            errorEl.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('user', JSON.stringify(data));
                    showToast('Welcome back, ' + data.fullName + '!', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else {
                    errorEl.textContent = data.message || 'Invalid credentials';
                    errorEl.style.display = 'block';
                    btn.innerHTML = '🔐 Sign In';
                    btn.disabled = false;
                }
            } catch (error) {
                console.warn('Backend offline, checking for emergency bypass...');
                // EMERGENCY BYPASS FOR VIVA
                if (username === 'admin' && password === 'admin123') {
                    const mockUser = {
                        success: true,
                        userId: 1,
                        username: 'admin',
                        fullName: 'Admin (Demo Mode)',
                        role: 'ADMIN',
                        isDemo: true
                    };
                    sessionStorage.setItem('user', JSON.stringify(mockUser));
                    showToast('Backend offline. Entering Demo Mode...', 'warning');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                } else {
                    errorEl.textContent = 'Server not reachable. Make sure the backend is running on port 8080.';
                    errorEl.style.display = 'block';
                    btn.innerHTML = '🔐 Sign In';
                    btn.disabled = false;
                }
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Check if already logged in
        if (sessionStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
