# Application Configuration
spring.application.name=Smart Perishable Monitoring System

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_perishable_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# Enable CORS for frontend
spring.web.cors.allowed-origins=*

# Static resources (frontend)
spring.web.resources.static-locations=classpath:/static/

# Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
